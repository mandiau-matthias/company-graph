name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m company_graph examples/companies.json --out docs --base-url https://mandiau-matthias.github.io/company-graph
      - run: git diff --exit-code -- docs
